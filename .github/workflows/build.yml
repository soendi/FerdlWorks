name: Build FerdlWorks

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Generate Icon
        shell: pwsh
        run: |
          python -c "from lib.icon import create_icon; create_icon()"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "FerdlWorks" `
            --icon "assets\ferdlworks.ico" `
            --add-data "assets\ferdlworks_theme.json;assets" `
            --add-data "assets\ferdlworks.ico;." `
            --hidden-import "customtkinter" `
            --hidden-import "PIL._tkinter_finder" `
            --hidden-import "win32print" `
            --hidden-import "packaging" `
            --hidden-import "packaging.version" `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "is-*-*.exe" } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Kein Inno Setup 7 Installer Asset gefunden"
            exit 1
          }
          $installer = "$env:TEMP\innosetup7.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS /DIR=C:\Program Files (x86)\Inno Setup 7" -Wait

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Error "ISCC.exe nicht gefunden"
            exit 1
          }
          Write-Host "ISCC gefunden: $iscc"
          & $iscc "installer\ferdlworks.iss"

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerdlWorks-Setup
          path: installer\FerdlWorks-Setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FerdlWorks ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: installer\FerdlWorks-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
