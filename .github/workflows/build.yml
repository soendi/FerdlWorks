name: Build FerdlWorks

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Generate Icon
        shell: pwsh
        run: |
          python -c "from lib.icon import create_icon; create_icon()"

      - name: Build EXE with PyInstaller (spec)
        shell: pwsh
        run: |
          pyinstaller --noconfirm ferdlworks.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $ver = python -c "exec(open('version.py').read()); print(VERSION)"
          Write-Host "Version aus version.py: $ver"
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Error "ISCC.exe nicht gefunden"
            exit 1
          }
          Write-Host "ISCC gefunden: $iscc"
          & $iscc "/dMyAppVersion=$ver" "installer\ferdlworks.iss"

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerdlWorks-Setup
          path: installer\FerdlWorks-Setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FerdlWorks ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: installer\FerdlWorks-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
